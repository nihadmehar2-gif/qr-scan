<title>QR Studio – Scan & Create</title>
<style>
:root{--bg:#080a14;--gl:rgba(255,255,255,.065);--ln:rgba(255,255,255,.13);--tx:#f1f3ff;--mu:#9ea5c4;--v:#7c5cff;--c:#22d3ee;--ok:#5eead4;--er:#ff7a9a;--g:linear-gradient(135deg,#7c5cff,#22d3ee)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vmax 60vmax at 0 0,rgba(91,61,245,.36),transparent 70%),radial-gradient(60vmax 60vmax at 100% 100%,rgba(10,165,194,.26),transparent 70%)}
main{max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 110px}
header{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.logo{width:44px;height:44px;border-radius:14px;background:var(--g);display:grid;place-items:center;box-shadow:0 8px 24px rgba(124,92,255,.45)}
.logo .i{width:24px;height:24px;color:#fff}
h1{font-size:1.3rem;margin:0;letter-spacing:.2px}
header p{margin:0;color:var(--mu);font-size:.85rem}
.i{width:20px;height:20px;flex:none}
.card{background:var(--gl);border:1px solid var(--ln);border-radius:24px;padding:16px;margin-bottom:16px;background:rgba(28,31,56,.78)}
.vf{position:relative;aspect-ratio:1;max-height:72vh;width:100%;border-radius:22px;overflow:hidden;background:rgba(0,0,0,.35);display:grid;place-items:center;margin-bottom:14px}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.vf.live video{display:block}
.vf .idle{text-align:center;color:var(--mu);padding:20px}
.vf .idle .i{width:46px;height:46px;color:var(--c);margin-bottom:8px}
.vf.live .idle{display:none}
.vf .k{position:absolute;width:42px;height:42px;border:4px solid var(--c);border-radius:14px}
.vf .k1{top:16px;left:16px;border-right:0;border-bottom:0}.vf .k2{top:16px;right:16px;border-left:0;border-bottom:0}
.vf .k3{bottom:16px;left:16px;border-right:0;border-top:0}.vf .k4{bottom:16px;right:16px;border-left:0;border-top:0}
.vf .ln{position:absolute;left:12%;right:12%;top:12%;height:76%;display:none;will-change:transform;background:linear-gradient(90deg,#7c5cff,#22d3ee) bottom/100% 3px no-repeat,linear-gradient(to top,rgba(34,211,238,.22),transparent 45%)}
.vf.live .ln{display:block;animation:sc 2.2s ease-in-out infinite alternate}
@keyframes sc{from{transform:translateY(-100%)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.vf.live .ln{animation:none;transform:translateY(-50%)}}
.row{display:flex;gap:10px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 12px;border-radius:16px;border:1px solid var(--ln);background:var(--gl);color:var(--tx);font-family:inherit;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--g);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(80,90,255,.35)}
.btn.sq{flex:none;width:54px;padding:0}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.hide{display:none!important}
.msg{margin:10px 2px 0;font-size:.9rem;min-height:1.2em;color:var(--mu)}.msg.er{color:var(--er)}.msg.ok{color:var(--ok)}
.sponsor-btn{flex:none;display:inline-flex;margin:6px auto 0;padding:9px 16px;font-size:.82rem;font-weight:600;background:rgba(124,92,255,.12);border:1px dashed rgba(124,92,255,.5);color:var(--c);text-decoration:none;border-radius:12px;opacity:.85}
.sponsor-btn:active{transform:scale(.97)}
.rh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.chip{width:46px;height:46px;border-radius:15px;background:var(--g);display:grid;place-items:center}
.chip .i{width:23px;height:23px;color:#fff}
.rh b{display:block;font-size:1.05rem}.rh small{color:var(--mu)}
.rows{background:rgba(0,0,0,.28);border-radius:16px;padding:4px 14px;margin-bottom:12px}
.rw{padding:10px 0;border-top:1px solid var(--ln);word-break:break-word;white-space:pre-wrap}
.rw:first-child{border-top:0}.rw small{display:block;color:var(--mu);font-size:.78rem}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acts .btn.w{grid-column:1/-1}
.note{font-size:.85rem;color:var(--mu);margin:12px 2px 0}
label{display:block;color:var(--mu);font-size:.85rem;margin:14px 2px 6px}
input,select,textarea{width:100%;padding:14px;border-radius:14px;border:1px solid var(--ln);background:rgba(0,0,0,.3);color:var(--tx);font:inherit}
textarea{min-height:92px;resize:vertical}
select option{background:#14172b}
.sw{display:flex;gap:12px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff}
.qb{display:none;text-align:center}.qb.on{display:block}
.qf{display:inline-block;background:#fff;padding:14px;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.45);margin-bottom:14px;max-width:100%}
#qr{display:block;width:100%;max-width:280px;height:auto;image-rendering:pixelated}
.h{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.h:first-child{border-top:0}.h .chip{width:40px;height:40px;border-radius:13px}
.h div.t{flex:1;min-width:0}.h b{display:block;font-size:.8rem;color:var(--c)}
.h span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.92rem}
.h .btn{flex:none;padding:9px 14px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;border-radius:24px;background:rgba(20,23,43,.96);border:1px solid var(--ln);width:min(92vw,400px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border:0;border-radius:18px;background:transparent;color:var(--mu);font-family:inherit;font-size:.78rem;font-weight:600}
.nav button.on{background:var(--g);color:#fff}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:#fff;color:#10122a;padding:10px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.vf.drag{outline:3px dashed var(--c);outline-offset:-6px}
#p-hist{max-width:640px;margin:0 auto}
@media (hover:hover){.btn:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.11)}.btn.p:hover{filter:brightness(1.12)}.nav button:hover{color:var(--tx)}}
@media (min-width:700px){
main{max-width:960px;padding:104px 28px 48px}
.nav{top:18px;bottom:auto;width:min(92vw,420px)}
.toast{bottom:32px}
.vf{aspect-ratio:4/3}
#p-scan,#p-make{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.card{margin-bottom:0}
h1{font-size:1.5rem}
}
@media (min-width:1200px){main{max-width:1100px}}
@media (max-height:520px) and (orientation:landscape){main{padding-bottom:90px}.vf{max-height:60vh}}

<body>
<main>
<header><div class="logo" data-i="grid"></div><div><h1>QR Studio</h1><p id="sub">Scan any QR code</p></div><button class="btn hide" id="instBtn" style="flex:none;margin-left:auto;padding:10px 14px"><span data-i="dl"></span>Install</button></header>

<section id="p-scan">
  <div class="card">
    <div class="vf" id="vf"><video id="vid" playsinline muted></video>
      <div class="idle"><span data-i="scan"></span><div>Ready to scan</div></div>
      <span class="k k1"></span><span class="k k2"></span><span class="k k3"></span><span class="k k4"></span><div class="ln"></div>
    </div>
    <div class="row">
      <button class="btn p" id="camBtn"><span data-i="cam"></span>Start camera</button>
      <button class="btn p hide" id="stopBtn"><span data-i="stop"></span>Stop camera</button>
      <button class="btn sq hide" id="torchBtn" aria-label="Flashlight"><span data-i="bolt"></span></button>
      <button class="btn sq hide" id="flipBtn" aria-label="Switch camera"><span data-i="flip"></span></button>
      <button class="btn sq" id="galBtn" aria-label="Scan from image"><span data-i="img"></span></button>
    </div>
    <input type="file" id="file" accept="image/*" class="hide">
    <p class="msg" id="scanMsg"></p>
  </div>
  <div class="card hide" id="resCard">
    <div class="rh"><div class="chip" id="rChip"></div><div><b id="rType"></b><small id="rSub"></small></div></div>
    <div class="rows" id="rRows"></div>
    <div class="acts" id="rActs"></div>
    <p class="note hide" id="rNote"></p>
  </div>
</section>

<section id="p-make" class="hide">
  <div class="card">
    <label for="kind" style="margin-top:0">What do you want to share?</label>
    <select id="kind"><option value="text">Text or link</option><option value="wifi">Wi-Fi network</option><option value="tel">Phone number</option></select>
    <div id="f-text"><label for="txt">Text or link</label><textarea id="txt" placeholder="https://example.com"></textarea></div>
    <div id="f-wifi" class="hide">
      <label for="ssid">Network name</label><input id="ssid" autocomplete="off">
      <label for="pw">Password</label><input id="pw" autocomplete="off">
      <label for="sec">Security</label><select id="sec"><option value="WPA">WPA / WPA2 / WPA3</option><option value="WEP">WEP</option><option value="nopass">None</option></select>
    </div>
    <div id="f-tel" class="hide"><label for="tel">Phone number</label><input id="tel" type="tel" placeholder="+923001234567"></div>
    <label>Color</label>
    <div class="sw" id="sw"></div>
    <label for="ecc">Error correction</label>
    <select id="ecc"><option value="L">Low</option><option value="M" selected>Medium</option><option value="Q">High</option><option value="H">Highest</option></select>
    <div class="row" style="margin-top:18px"><button class="btn p" id="mkBtn"><span data-i="grid"></span>Create QR code</button></div>
    <p class="msg" id="mkMsg"></p>
  </div>
  <div class="card qb" id="qb">
    <div class="qf"><canvas id="qr" width="300" height="300"></canvas></div>
    <div class="row"><button class="btn" id="dlBtn"><span data-i="dl"></span>Save</button><button class="btn" id="qshare"><span data-i="share"></span>Share</button></div>
  </div>
</section>

<section id="p-hist" class="hide">
  <div class="card"><div id="hist"></div><p class="msg" id="hEmpty">No scans yet. Scanned codes will appear here.</p></div>
  <div class="row"><button class="btn hide" id="clrBtn"><span data-i="trash"></span>Clear history</button></div>
  <a class="btn sponsor-btn" href="https://asiafilm.org/4/f6fa51c0b2df90b6748dd3ff46b8008c" target="_blank" rel="noopener noreferrer" aria-label="Sponsored offers - opens in your browser"><span data-i="gift"></span>Sponsored Offers</a>
</section>
</main>

<nav class="nav">
  <button data-t="scan" class="on"><span data-i="scan"></span>Scan</button>
  <button data-t="make"><span data-i="grid"></span>Create</button>
  <button data-t="hist"><span data-i="clock"></span>History</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var P={
scan:'<path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10"/>',
grid:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 19h.01M19 14h.01"/>',

dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',
stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',

gift:'<rect x="3" y="8" width="18" height="13" rx="1.5"/><path d="M3 12h18M12 8v13M12 8S9 4 7 5s1 3 5 3zM12 8s3-4 5-3-1 3-5 3z"/>'
};
function ic(n){return'<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[n]||P.text)+'</svg>'}
document.querySelectorAll("[data-i]").forEach(function(e){e.innerHTML=ic(e.dataset.i);if(e.tagName==="SPAN")e.style.display="contents"});

var stream=null,scanning=false,detector=null,current="",tt=null,track=null,torchOn=false,facing="environment",deferred=null;
try{if("BarcodeDetector" in window)detector=new BarcodeDetector({formats:["qr_code"]})}catch(e){detector=null}
try{if(window.qrcode&&qrcode.stringToBytesFuncs&&qrcode.stringToBytesFuncs["UTF-8"])qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"]}catch(e){}
function msg(id,t,c){var e=$(id);e.textContent=t||"";e.className="msg"+(c?" "+c:"")}
function show(e,on){e.classList.toggle("hide",!on)}
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on")},1800)}

/* tabs */
var T={scan:"Scan any QR code",make:"Create your own QR code",hist:"Your recent scans"};
document.querySelectorAll(".nav button").forEach(function(b){b.addEventListener("click",function(){
  var t=b.dataset.t;
  document.querySelectorAll(".nav button").forEach(function(x){x.classList.toggle("on",x===b)});
  ["scan","make","hist"].forEach(function(k){show($("#p-"+k),k===t)});
  $("#sub").textContent=T[t];
  if(t!=="scan")stopCam();
  if(t==="hist")renderHist();
})});

/* decode */
async function decodeCanvas(c){
  if(detector){try{var r=await detector.detect(c);if(r&&r.length&&r[0].rawValue)return r[0].rawValue}catch(e){}}
  if(window.jsQR){
    var d=c.getContext("2d",{willReadFrequently:true}).getImageData(0,0,c.width,c.height);
    var q=jsQR(d.data,d.width,d.height,{inversionAttempts:"attemptBoth"});
    if(q&&q.data)return q.data;
  }
  return null;
}
var cv=document.createElement("canvas");
async function startCam(){
  msg("#scanMsg","");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg("#scanMsg","Camera is not available here. Use the image button to scan from your gallery.","er");return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}},audio:false});
    var v=$("#vid");v.srcObject=stream;await v.play();
    track=stream.getVideoTracks()[0]||null;torchOn=false;
    scanning=true;$("#vf").classList.add("live");show($("#camBtn"),false);show($("#stopBtn"),true);
    show($("#torchBtn"),true);$("#torchBtn").style.opacity=torchOK()?"":".55";
    try{navigator.mediaDevices.enumerateDevices().then(function(d){if(scanning)show($("#flipBtn"),d.filter(function(x){return x.kind==="videoinput"}).length>1)}).catch(function(){})}catch(x){}
    msg("#scanMsg","Point the camera at a QR code.");loop();
  }catch(e){
    stopCam();var n=e&&e.name;
    msg("#scanMsg",n==="NotAllowedError"||n==="SecurityError"?"Camera permission is blocked. Allow camera access in settings and try again.":n==="NotFoundError"||n==="OverconstrainedError"?"No camera found on this device.":"Could not start the camera. Close other apps that use it and try again.","er");
  }
}
function stopCam(){
  scanning=false;
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  $("#vid").srcObject=null;$("#vf").classList.remove("live");show($("#camBtn"),true);show($("#stopBtn"),false);
  track=null;torchOn=false;$("#torchBtn").classList.remove("p");show($("#torchBtn"),false);show($("#flipBtn"),false);
}
function torchOK(){try{var c=track&&track.getCapabilities&&track.getCapabilities();return!!(c&&c.torch)}catch(e){return false}}
async function setTorch(on){
  if(!torchOK()){toast("Flashlight isn’t available on this device or browser");return}
  try{await track.applyConstraints({advanced:[{torch:on}]});torchOn=on;$("#torchBtn").classList.toggle("p",on)}
  catch(e){toast("Could not turn the flashlight on")}
}
var fr=0;
async function loop(){
  if(!scanning)return;
  var v=$("#vid"),t=null;
  if(v.readyState>=2&&v.videoWidth){
    fr++;
    try{
      if(detector){var r=await detector.detect(v);if(r&&r.length)t=r[0].rawValue}
      else if(window.jsQR){
        var k=Math.min(1,560/v.videoWidth);
        cv.width=Math.round(v.videoWidth*k);cv.height=Math.round(v.videoHeight*k);
        var x=cv.getContext("2d",{willReadFrequently:true});x.drawImage(v,0,0,cv.width,cv.height);
        var d=x.getImageData(0,0,cv.width,cv.height);
        var q=jsQR(d.data,d.width,d.height,{inversionAttempts:fr%4===0?"attemptBoth":"dontInvert"});
        if(q&&q.data)t=q.data;
      }
    }catch(e){detector=null}
    if(t&&scanning){stopCam();try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}msg("#scanMsg","");result(t);return}
  }
  setTimeout(loop,detector?60:90);
}
function loadImg(f){return new Promise(function(res,rej){var u=URL.createObjectURL(f),i=new Image();i.onload=function(){URL.revokeObjectURL(u);res(i)};i.onerror=function(){URL.revokeObjectURL(u);rej(new Error("bad"))};i.src=u})}
async function scanFile(f){
  if(!f)return;
  if(f.type&&f.type.indexOf("image/")!==0){msg("#scanMsg","Please choose an image file.","er");return}
  msg("#scanMsg","Scanning…");
  try{
    var img=await loadImg(f),w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)throw new Error("empty");
    var sz=[1000,1600,600,400],c=document.createElement("canvas");
    for(var k=0;k<sz.length;k++){
      var s=Math.min(1,sz[k]/Math.max(w,h));
      c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
      var x=c.getContext("2d",{willReadFrequently:true});x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      var t=await decodeCanvas(c);
      if(t){msg("#scanMsg","");result(t);return}
    }
    msg("#scanMsg","No QR code found. Try a sharper image with the whole code visible.","er");
  }catch(e){msg("#scanMsg","Could not read this image. Try a different file.","er")}
}

/* parsing */
function dec(s){try{return decodeURIComponent(s)}catch(e){return s}}
function unesc(s){return s.replace(/\\(.)/g,"$1")}
function wifiParse(t){
  var o={},b=t.slice(5),parts=[],cur="",i,ch;
  for(i=0;i<b.length;i++){ch=b[i];if(ch==="\\"&&i+1<b.length)cur+=b[++i];else if(ch===";"){parts.push(cur);cur=""}else cur+=ch}
  if(cur)parts.push(cur);
  parts.forEach(function(p){var j=p.indexOf(":");if(j>0)o[p.slice(0,j).toUpperCase()]=p.slice(j+1)});
  return o;
}
function vcard(t){
  var o={};
  t.split(/\r?\n/).forEach(function(l){
    var j=l.indexOf(":");if(j<1)return;
    var k=l.slice(0,j).split(";")[0].toUpperCase(),v=l.slice(j+1).trim();
    if(k==="FN"&&!o.name)o.name=v;
    else if(k==="N"&&!o.n){var p=v.split(";");o.n=((p[1]||"")+" "+(p[0]||"")).trim()}
    else if(k==="TEL"&&!o.tel)o.tel=v;
    else if(k==="EMAIL"&&!o.mail)o.mail=v;
    else if(k==="ORG"&&!o.org)o.org=v.replace(/;/g," ");
  });
  if(!o.name)o.name=o.n||"";
  return o;
}
function info(t){
  var m,r;
  if(/^https?:\/\/\S+$/i.test(t))return{k:"Website link",i:"link",rows:[["Link",t]],href:t};
  if(/^WIFI:/i.test(t)){var w=wifiParse(t);return{k:"Wi-Fi network",i:"wifi",wifi:w,rows:[["Network",w.S||"(unknown)"],["Password",w.P||"(none)"],["Security",w.T||"(unknown)"]]}}
  if(/^tel:/i.test(t)){var n=t.slice(4).trim();return{k:"Phone number",i:"phone",rows:[["Number",n]],tel:n}}
  if(/^mailto:/i.test(t)){
    var a=t.slice(7),q=a.indexOf("?"),addr=dec(q<0?a:a.slice(0,q)),rows=[["To",addr]];
    try{var u=new URLSearchParams(q<0?"":a.slice(q+1));if(u.get("subject"))rows.push(["Subject",u.get("subject")]);if(u.get("body"))rows.push(["Message",u.get("body")])}catch(e){}
    return{k:"Email",i:"mail",rows:rows,mail:"mailto:"+a}
  }
  if(/^smsto?:/i.test(t)){
    var b=t.replace(/^smsto?:/i,""),num,body="";
    if(/^smsto:/i.test(t)){var p=b.split(":");num=p.shift();body=p.join(":")}
    else{var j=b.indexOf("?");num=j<0?b:b.slice(0,j);if(j>=0)try{body=new URLSearchParams(b.slice(j+1)).get("body")||""}catch(e){}}
    var rr=[["To",num]];if(body)rr.push(["Message",body]);
    return{k:"SMS message",i:"msg",rows:rr,sms:"sms:"+num+(body?"?body="+encodeURIComponent(body):""),tel:num}
  }
  if(/^BEGIN:VCARD/i.test(t)){
    var c=vcard(t),rc=[];
    if(c.name)rc.push(["Name",c.name]);if(c.org)rc.push(["Company",c.org]);if(c.tel)rc.push(["Phone",c.tel]);if(c.mail)rc.push(["Email",c.mail]);
    if(!rc.length)rc.push(["Contact",t]);
    return{k:"Contact card",i:"user",rows:rc,vcf:t,tel:c.tel,mail:c.mail&&"mailto:"+c.mail}
  }
  if(/^geo:/i.test(t)&&(m=t.slice(4).split(/[;?]/)[0])&&/^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(m))
    return{k:"Location",i:"pin",rows:[["Coordinates",m]],map:"https://www.google.com/maps?q="+m};
  return{k:"Text",i:"text",rows:[["Text",t]],text:t};
}

/* result UI */
function act(l,icon,o){
  var e;
  if(o.href){e=document.createElement("a");e.href=o.href;if(o.ext){e.target="_blank";e.rel="noopener noreferrer"}}
  else{e=document.createElement("button");e.addEventListener("click",o.fn)}
  e.className="btn"+(o.p?" p":"")+(o.w?" w":"");
  e.innerHTML=ic(icon)+"<span></span>";e.lastChild.textContent=l;
  $("#rActs").appendChild(e);return e;
}
async function copy(t,label){
  try{await navigator.clipboard.writeText(t);toast((label||"Text")+" copied");return}catch(e){}
  try{var a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();var ok=document.execCommand("copy");document.body.removeChild(a);toast(ok?(label||"Text")+" copied":"Copy failed")}
  catch(e){toast("Copy failed")}
}
function saveVcf(t){
  var b=new Blob([t],{type:"text/vcard"}),u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download="contact.vcf";document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u)},4000);
}
function result(t){
  current=t;var d=info(t);
  $("#rChip").innerHTML=ic(d.i);$("#rType").textContent=d.k;$("#rSub").textContent="Scanned just now";
  var rows=$("#rRows");rows.textContent="";
  d.rows.forEach(function(r){var e=document.createElement("div");e.className="rw";var s=document.createElement("small");s.textContent=r[0];e.appendChild(s);e.appendChild(document.createTextNode(r[1]));rows.appendChild(e)});
  $("#rActs").textContent="";var note="";
  if(d.href){act("Open link","link",{href:d.href,ext:1,p:1,w:1});note="Check that you trust this link before opening it."}
  if(d.wifi){
    var w=d.wifi;

  }

var qrC=$("#qr"),ready=false,col="#000000";
["#000000","#4c1d95","#0f766e","#9f1239"].forEach(function(c,i){
  var b=document.createElement("button");b.style.background=c;b.setAttribute("aria-label","Color "+(i+1));if(!i)b.className="on";
  b.addEventListener("click",function(){col=c;document.querySelectorAll("#sw button").forEach(function(x){x.classList.toggle("on",x===b)})});
  $("#sw").appendChild(b);
});
$("#kind").addEventListener("change",function(){var k=this.value;show($("#f-text"),k==="text");show($("#f-wifi"),k==="wifi");show($("#f-tel"),k==="tel")});
function esc(s){return s.replace(/([\\;,:"])/g,"\\$1")}
function payload(){
  var k=$("#kind").value;
  if(k==="text"){var t=$("#txt").value.trim();if(!t)throw new Error("Enter some text or a link first.");return t}
  if(k==="tel"){var n=$("#tel").value.replace(/[\s\-()]/g,"");if(!/^\+?\d{3,15}$/.test(n))throw new Error("Enter a valid phone number, like +923001234567.");return"tel:"+n}
  var s=$("#ssid").value,sec=$("#sec").value,p=$("#pw").value;
  if(!s)throw new Error("Enter the network name.");
  if(sec!=="nopass"&&!p)throw new Error("Enter the Wi-Fi password, or choose “None”.");
  return"WIFI:T:"+sec+";S:"+esc(s)+";"+(sec==="nopass"?"":"P:"+esc(p)+";")+";";
}
function make(){
  ready=false;$("#qb").classList.remove("on");
  try{
    if(!window.qrcode)throw new Error("The QR library did not load. Check your internet connection and reload.");
    var data=payload(),q=qrcode(0,$("#ecc").value);q.addData(data);q.make();
    var n=q.getModuleCount(),qz=4,cell=Math.max(4,Math.floor(1024/(n+2*qz))),size=cell*(n+2*qz);
    qrC.width=size;qrC.height=size;
    var x=qrC.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,size,size);x.fillStyle=col;
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))x.fillRect((c+qz)*cell,(r+qz)*cell,cell,cell);
    ready=true;$("#qb").classList.add("on");show($("#qshare"),!!navigator.share);msg("#mkMsg","QR code ready.","ok");
    $("#qb").scrollIntoView({behavior:"smooth",block:"nearest"});
  }catch(e){
    var m=e&&e.message||"";
    msg("#mkMsg",/overflow|length/i.test(m)?"Too much data for one QR code. Shorten it or lower the error correction.":m||"Could not create the QR code.","er");
  }
}
function blob(){return new Promise(function(r){qrC.toBlob(r,"image/png")})}
async function save(){
  if(!ready)return;var b=await blob();if(!b){toast("Could not save");return}
  var u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="qr-code.png";document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u)},4000);toast("Saved. If nothing downloaded, use Share");
}
async function shareQR(){
  if(!ready)return;
  try{var b=await blob(),f=new File([b],"qr-code.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast("Sharing images isn’t supported here. Use Save");
  }catch(e){if(e&&e.name!=="AbortError")toast("Could not share")}
}
